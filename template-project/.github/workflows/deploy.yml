name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'template-project/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment without tests'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: project-08401bb0-e467-491a-ac0
  GCP_REGION: us-central1
  SERVICE_NAME: template-project
  ARTIFACT_REGISTRY: cloud-run-source-deploy
  RUNTIME_SA: template-project-runtime@project-08401bb0-e467-491a-ac0.iam.gserviceaccount.com

jobs:
  quality-gates:
    name: Quality Gates & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-project
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: template-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Verify knowledge sync
        run: npm run verify:sync

      - name: Run API tests
        run: npm run test:api

  build-and-push:
    name: Build & Push Container
    needs: quality-gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-project
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_url: ${{ steps.push.outputs.image-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT }}/locations/global/workloadIdentityProviders/github-provider
          service_account: github-actions@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Set image metadata
        id: image-meta
        run: |
          COMMIT_SHA=${{ github.sha }}
          SHORT_SHA=${COMMIT_SHA:0:7}
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:${SHORT_SHA}-${TIMESTAMP}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_tag_latest=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:latest" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.image-meta.outputs.image_tag }} \
                       -t ${{ steps.image-meta.outputs.image_tag_latest }} \
                       .

      - name: Push Docker image
        id: push
        run: |
          docker push ${{ steps.image-meta.outputs.image_tag }}
          docker push ${{ steps.image-meta.outputs.image_tag_latest }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.image-meta.outputs.image_tag }} | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image-url=${{ steps.image-meta.outputs.image_tag }}" >> $GITHUB_OUTPUT
          echo "Image pushed: ${{ steps.image-meta.outputs.image_tag }}"
          echo "Digest: ${DIGEST}"

  deploy-to-cloud-run:
    name: Deploy to Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-project
    outputs:
      service_url: ${{ steps.deploy.outputs.service-url }}
      revision: ${{ steps.deploy.outputs.revision }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT }}/locations/global/workloadIdentityProviders/github-provider
          service_account: github-actions@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          SERVICE_URL=$(gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ needs.build-and-push.outputs.image_url }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --service-account=${{ env.RUNTIME_SA }} \
            --set-secrets="DATABASE_PASSWORD=template-app-db-password:latest,JWT_SECRET=template-project-jwt-secret:latest" \
            --set-env-vars="NODE_ENV=production,LOG_LEVEL=info,METRICS_ENABLED=true,API_VERSION=v1,CORS_ORIGINS=*,RATE_LIMIT_WINDOW_MS=900000,RATE_LIMIT_MAX_REQUESTS=100,PORT=8080" \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=100 \
            --min-instances=0 \
            --max-instances=100 \
            --allow-unauthenticated \
            --ingress=all \
            --timeout=3600 \
            --format='value(status.url)')
          
          REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --format='value(status.latestRevisionName)')
          
          echo "service-url=${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "revision=${REVISION}" >> $GITHUB_OUTPUT
          echo "Deployment successful!"
          echo "Service URL: ${SERVICE_URL}"
          echo "Revision: ${REVISION}"

  smoke-tests:
    name: Smoke Tests
    needs: deploy-to-cloud-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-project
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: template-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for service to be ready
        run: |
          MAX_RETRIES=30
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Health check attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"
            if curl -f --connect-timeout 5 --max-time 10 "${{ needs.deploy-to-cloud-run.outputs.service_url }}/health"; then
              echo "✓ Service is healthy"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "  Retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "✗ Service failed to become healthy after $MAX_RETRIES attempts"
          exit 1

      - name: Test health endpoint
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" "${{ needs.deploy-to-cloud-run.outputs.service_url }}/health")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Health endpoint returned 200"
          else
            echo "✗ Health endpoint returned $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Test OpenAPI docs endpoint
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" "${{ needs.deploy-to-cloud-run.outputs.service_url }}/docs")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ OpenAPI docs endpoint returned 200"
          else
            echo "✗ OpenAPI docs endpoint returned $HTTP_CODE"
            exit 1
          fi

      - name: Test metrics endpoint
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" "${{ needs.deploy-to-cloud-run.outputs.service_url }}/metrics")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Metrics endpoint returned 200"
          else
            echo "✗ Metrics endpoint returned $HTTP_CODE"
            exit 1
          fi

      - name: Test registration endpoint
        run: |
          TIMESTAMP=$(date +%s%N)
          EMAIL="test-smoke-${TIMESTAMP}@example.com"
          PASSWORD="SmokeTest123456"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ needs.deploy-to-cloud-run.outputs.service_url }}/v1/registration" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" = "201" ]; then
            echo "✓ Registration endpoint returned 201"
            echo "Response: $BODY"
          else
            echo "✗ Registration endpoint returned $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Test authentication flow
        run: |
          TIMESTAMP=$(date +%s%N)
          EMAIL="test-auth-${TIMESTAMP}@example.com"
          PASSWORD="AuthTest123456"
          
          # Register
          RESPONSE=$(curl -s -X POST \
            "${{ needs.deploy-to-cloud-run.outputs.service_url }}/v1/registration" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}")
          
          REG_STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')
          
          # Login
          LOGIN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ needs.deploy-to-cloud-run.outputs.service_url }}/v1/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}")
          
          HTTP_CODE=$(echo "$LOGIN_RESPONSE" | tail -n1)
          BODY=$(echo "$LOGIN_RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" = "200" ]; then
            TOKEN=$(echo "$BODY" | jq -r '.token')
            if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
              echo "✓ Authentication flow successful"
              echo "✓ Token obtained: ${TOKEN:0:20}..."
            else
              echo "✗ No token in response"
              exit 1
            fi
          else
            echo "✗ Login endpoint returned $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

  deployment-summary:
    name: Deployment Summary
    needs: [deploy-to-cloud-run, smoke-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate deployment summary
        run: |
          cat > /tmp/deployment_summary.txt <<EOF
          ## ✅ Deployment Complete
          
          **Service:** ${{ env.SERVICE_NAME }}
          **Region:** ${{ env.GCP_REGION }}
          **Project:** ${{ env.GCP_PROJECT }}
          
          **Deployment Details:**
          - Service URL: ${{ needs.deploy-to-cloud-run.outputs.service_url }}
          - Revision: ${{ needs.deploy-to-cloud-run.outputs.revision }}
          - Image Digest: ${{ needs.build-and-push.outputs.image_digest }}
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          
          **Verification:**
          - ✓ Quality gates passed
          - ✓ Container built and pushed
          - ✓ Cloud Run deployment successful
          - ✓ Smoke tests passed
          - ✓ Health checks verified
          
          **Next Steps:**
          1. Monitor service at: ${{ needs.deploy-to-cloud-run.outputs.service_url }}
          2. View logs: \`gcloud run logs read ${{ env.SERVICE_NAME }} --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }}\`
          3. To rollback, see rollback runbook (Task 22)
          EOF
          cat /tmp/deployment_summary.txt

      - name: Comment on commit
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/deployment_summary.txt', 'utf8');
            
            github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: `Deploy: ${{ env.SERVICE_NAME }} to Cloud Run\n\nRevision: ${{ needs.deploy-to-cloud-run.outputs.revision }}`,
              tree: context.payload.head_commit.tree_id,
              parents: [context.payload.head_commit.id]
            }).catch(err => console.log('Commit comment skipped'));

  rollback-on-failure:
    name: Rollback on Failure
    needs: [deploy-to-cloud-run, smoke-tests]
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'push'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT }}/locations/global/workloadIdentityProviders/github-provider
          service_account: github-actions@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Get previous revision
        id: previous
        run: |
          REVISIONS=$(gcloud run revisions list \
            --service=${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --format='value(name)' \
            --sort-by='~creation-timestamp' \
            --limit=2)
          
          PREVIOUS=$(echo "$REVISIONS" | tail -n1)
          echo "revision=${PREVIOUS}" >> $GITHUB_OUTPUT
          echo "Previous revision: ${PREVIOUS}"

      - name: Rollback to previous revision
        if: steps.previous.outputs.revision != ''
        run: |
          echo "Rolling back to revision: ${{ steps.previous.outputs.revision }}"
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --to-revisions=${{ steps.previous.outputs.revision }}=100 \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }}
          
          echo "✓ Rollback complete"

      - name: Notify rollback
        run: |
          echo "::error::Deployment failed and rolled back to previous revision: ${{ steps.previous.outputs.revision }}"
