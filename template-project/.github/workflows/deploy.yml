name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'template-project/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment without tests'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: project-08401bb0-e467-491a-ac0
  GCP_REGION: us-central1
  SERVICE_NAME: template-project
  ARTIFACT_REGISTRY: cloud-run-source-deploy
  RUNTIME_SA: template-project-runtime@project-08401bb0-e467-491a-ac0.iam.gserviceaccount.com

jobs:
  quality-gates:
    name: Quality Gates & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-project
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: template-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Verify knowledge sync
        run: npm run verify:sync

      - name: Run API tests
        run: npm run test:api

  build-and-push:
    name: Build & Push Container
    needs: quality-gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-project
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_url: ${{ steps.push.outputs.image-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT }}/locations/global/workloadIdentityProviders/github-provider
          service_account: github-actions@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Set image metadata
        id: image-meta
        run: |
          COMMIT_SHA=${{ github.sha }}
          SHORT_SHA=${COMMIT_SHA:0:7}
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:${SHORT_SHA}-${TIMESTAMP}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_tag_latest=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:latest" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.image-meta.outputs.image_tag }} \
                       -t ${{ steps.image-meta.outputs.image_tag_latest }} \
                       .

      - name: Push Docker image
        id: push
        run: |
          docker push ${{ steps.image-meta.outputs.image_tag }}
          docker push ${{ steps.image-meta.outputs.image_tag_latest }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.image-meta.outputs.image_tag }} | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image-url=${{ steps.image-meta.outputs.image_tag }}" >> $GITHUB_OUTPUT
          echo "Image pushed: ${{ steps.image-meta.outputs.image_tag }}"
          echo "Digest: ${DIGEST}"

  deploy-to-cloud-run:
    name: Deploy to Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-project
    outputs:
      service_url: ${{ steps.deploy.outputs.service-url }}
      revision: ${{ steps.deploy.outputs.revision }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT }}/locations/global/workloadIdentityProviders/github-provider
          service_account: github-actions@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          SERVICE_URL=$(gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ needs.build-and-push.outputs.image_url }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --service-account=${{ env.RUNTIME_SA }} \
            --set-secrets="DATABASE_PASSWORD=template-app-db-password:latest,JWT_SECRET=template-project-jwt-secret:latest" \
            --set-env-vars="NODE_ENV=production,LOG_LEVEL=info,METRICS_ENABLED=true,API_VERSION=v1,CORS_ORIGINS=*,RATE_LIMIT_WINDOW_MS=900000,RATE_LIMIT_MAX_REQUESTS=100,PORT=8080" \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=100 \
            --min-instances=0 \
            --max-instances=100 \
            --allow-unauthenticated \
            --ingress=all \
            --timeout=3600 \
            --format='value(status.url)')
          
          REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --format='value(status.latestRevisionName)')
          
          echo "service-url=${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "revision=${REVISION}" >> $GITHUB_OUTPUT
          echo "Deployment successful!"
          echo "Service URL: ${SERVICE_URL}"
          echo "Revision: ${REVISION}"

  smoke-tests:
    name: Smoke Gates
    needs: deploy-to-cloud-run
    uses: ./.github/workflows/smoke-gates.yml
    with:
      service_url: ${{ needs.deploy-to-cloud-run.outputs.service_url }}
      revision: ${{ needs.deploy-to-cloud-run.outputs.revision }}
      image_digest: ${{ needs.build-and-push.outputs.image_digest }}
      error_rate_threshold: 5
      latency_threshold_ms: 2000

  deployment-summary:
    name: Deployment Summary
    needs: [build-and-push, deploy-to-cloud-run, smoke-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write deployment summary
        run: |
          SMOKE_RESULT="${{ needs.smoke-tests.result }}"
          [ "$SMOKE_RESULT" = "success" ] && STATUS="✅ SUCCEEDED" || STATUS="❌ FAILED"
          
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## Deployment Summary — $STATUS

          | Field | Value |
          |-------|-------|
          | Service | ${{ env.SERVICE_NAME }} |
          | Region | ${{ env.GCP_REGION }} |
          | Project | ${{ env.GCP_PROJECT }} |
          | Service URL | ${{ needs.deploy-to-cloud-run.outputs.service_url }} |
          | Revision | ${{ needs.deploy-to-cloud-run.outputs.revision }} |
          | Image | ${{ needs.build-and-push.outputs.image_digest }} |
          | Commit | ${{ github.sha }} |
          | Branch | ${{ github.ref_name }} |
          | Quality Gates | ${{ needs.quality-gates.result == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Build & Push | ${{ needs.build-and-push.result == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Deployment | ${{ needs.deploy-to-cloud-run.result == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Smoke Gates | ${{ needs.smoke-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |

          **Smoke gate details are in the Smoke Gates job above.**
          EOF

  rollback-on-failure:
    name: Rollback on Failure
    needs: [deploy-to-cloud-run, smoke-tests]
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'push'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT }}/locations/global/workloadIdentityProviders/github-provider
          service_account: github-actions@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Get previous revision
        id: previous
        run: |
          REVISIONS=$(gcloud run revisions list \
            --service=${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --format='value(name)' \
            --sort-by='~creation-timestamp' \
            --limit=2)
          
          PREVIOUS=$(echo "$REVISIONS" | tail -n1)
          echo "revision=${PREVIOUS}" >> $GITHUB_OUTPUT
          echo "Previous revision: ${PREVIOUS}"

      - name: Rollback to previous revision
        if: steps.previous.outputs.revision != ''
        run: |
          echo "Rolling back to revision: ${{ steps.previous.outputs.revision }}"
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --to-revisions=${{ steps.previous.outputs.revision }}=100 \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }}
          
          echo "✓ Rollback complete"

      - name: Notify rollback
        run: |
          echo "::error::Deployment failed and rolled back to previous revision: ${{ steps.previous.outputs.revision }}"
