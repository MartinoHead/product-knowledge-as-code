name: bda-quality

on:
  pull_request:
  workflow_dispatch:
    inputs:
      flow_mode:
        description: "Which analysis path to run"
        type: choice
        required: true
        default: both
        options:
          - simulate
          - real
          - both
      apply_mode:
        description: "Knowledge apply mode for LLM path"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - apply

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      FLOW_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.flow_mode || 'both' }}
      APPLY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_mode || 'dry-run' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13

      - name: Install dependencies
        working-directory: template-project
        run: npm ci

      - name: Lint
        working-directory: template-project
        run: npm run lint

      - name: Typecheck
        working-directory: template-project
        run: npm run typecheck

      - name: Verify knowledge sync (md/yaml/gherkin)
        working-directory: template-project
        run: npm run verify:sync

      - name: Prepare PR impact input
        if: ${{ env.FLOW_MODE == 'real' || env.FLOW_MODE == 'both' }}
        working-directory: template-project
        run: npm run prepare:pr-input

      - name: Analyze PR impact (LLM staged with deterministic fallback)
        if: ${{ env.FLOW_MODE == 'real' || env.FLOW_MODE == 'both' }}
        working-directory: template-project
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
        run: npm run analyze:pr-impact:staged

      - name: Validate LLM impact artifact
        if: ${{ env.FLOW_MODE == 'real' || env.FLOW_MODE == 'both' }}
        working-directory: template-project
        run: npm run validate:llm-impact

      - name: Apply knowledge updates (rollout controlled)
        if: ${{ env.FLOW_MODE == 'real' || env.FLOW_MODE == 'both' }}
        working-directory: template-project
        run: |
          if [ "${APPLY_MODE}" = "apply" ]; then
            APPLY_LLM_KNOWLEDGE_UPDATES=true npm run apply:knowledge:llm -- --apply
          else
            npm run apply:knowledge:llm
          fi

      - name: Simulate PR impact analysis
        if: ${{ env.FLOW_MODE == 'simulate' || env.FLOW_MODE == 'both' }}
        working-directory: template-project
        run: npm run simulate:impact

      - name: Simulate agent markdown knowledge update (legacy demo step)
        if: ${{ env.FLOW_MODE == 'simulate' || env.FLOW_MODE == 'both' }}
        working-directory: template-project
        run: npm run simulate:knowledge-update

      - name: Generate tests from knowledge
        working-directory: template-project
        run: npm run generate:tests

      - name: Fail on generated test drift
        run: git diff --exit-code

      - name: Verify rule coverage
        working-directory: template-project
        run: npm run verify:coverage

      - name: Execute API tests
        working-directory: template-project
        run: npm run test:api

      - name: Install Playwright browsers
        working-directory: template-project
        run: npx playwright install --with-deps

      - name: Execute Playwright UI tests
        working-directory: template-project
        run: npm run test:ui

      - name: Upload PR impact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-impact-artifacts
          if-no-files-found: warn
          path: |
            template-project/docs/last-impact-report.json
            template-project/docs/last-impact-report.md
            template-project/docs/llm-impact-analysis.json
            template-project/docs/llm-impact-analysis.md
            template-project/docs/llm-impact-analysis.raw.json
            template-project/docs/llm-impact-validation.json
            template-project/docs/llm-knowledge-apply.json

      - name: Comment PR with impact summary
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pkac-impact-summary -->';
            const reportPath = 'template-project/docs/llm-impact-analysis.md';
            const fallbackPath = 'template-project/docs/last-impact-report.md';
            const mode = process.env.FLOW_MODE;
            const applyMode = process.env.APPLY_MODE;

            let report = '';
            if (fs.existsSync(reportPath)) {
              report = fs.readFileSync(reportPath, 'utf8').trim();
            } else if (fs.existsSync(fallbackPath)) {
              report = fs.readFileSync(fallbackPath, 'utf8').trim();
            }

            const body = [
              marker,
              '## PKaC PR Impact Summary',
              `- Flow mode: ${mode}`,
              `- Apply mode: ${applyMode}`,
              '',
              report || '_No impact report was generated._'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
