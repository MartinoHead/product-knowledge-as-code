name: PR Knowledge Agent

# Triggered when a PR changes source code.
# The agent:
#   1. Reads the real git diff of changed source files
#   2. Calls an LLM to identify impacted knowledge features and propose edits
#   3. Applies knowledge file updates (md/yaml/gherkin)
#   4. Regenerates test scaffolds from updated knowledge
#   5. Commits the changes back to the PR branch
#   6. Posts a PR comment summarising what was updated
#
# The existing quality.yml then enforces the "no drift" gate on the next push,
# so the developer always sees a clean PR before merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'template-project/src/**'
      - 'template-project/prisma/**'
      - 'template-project/knowledge/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read  # Required for GitHub Models API (GitHub Copilot paid account)

jobs:
  agent:
    name: AI Knowledge Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-project

    steps:
      - name: Checkout PR branch (full history for diff)
        uses: actions/checkout@v4
        with:
          # Checkout the PR head — full history so we can diff against base
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Precheck scope and bypass controls
        id: precheck
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          BASE="${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch origin "${BASE}"

          if git merge-base "origin/${BASE}" HEAD >/dev/null 2>&1; then
            RANGE="origin/${BASE}...HEAD"
          else
            RANGE="origin/${BASE}..HEAD"
          fi

          mapfile -t CHANGED_FILES < <(git diff --name-only "${RANGE}")
          CHANGED_COUNT=${#CHANGED_FILES[@]}

          SKIP=false
          REASON=''
          MODE='run'

          if echo "${PR_LABELS}" | tr ',' '\n' | grep -Fxq 'skip-knowledge-agent'; then
            SKIP=true
            REASON='maintainer label skip-knowledge-agent present'
            MODE='label-bypass'
          fi

          if [ "${SKIP}" = false ] && printf '%s\n%s\n' "${PR_TITLE}" "${PR_BODY}" | grep -Eiq '\[skip[ _-]?pkac-agent\]'; then
            SKIP=true
            REASON='PR marker [skip pkac-agent] detected'
            MODE='marker-bypass'
          fi

          DOCS_ONLY=true
          if [ ${CHANGED_COUNT} -eq 0 ]; then
            DOCS_ONLY=false
          else
            for FILE in "${CHANGED_FILES[@]}"; do
              if [[ ! "${FILE}" =~ ^docs/ ]] && [[ ! "${FILE}" =~ ^template-project/docs/ ]]; then
                DOCS_ONLY=false
                break
              fi
            done
          fi

          if [ "${SKIP}" = false ] && [ "${DOCS_ONLY}" = true ]; then
            SKIP=true
            REASON='docs-only change set'
            MODE='docs-only-skip'
          fi

          echo "skip=${SKIP}" >> $GITHUB_OUTPUT
          echo "skip_reason=${REASON}" >> $GITHUB_OUTPUT
          echo "mode=${MODE}" >> $GITHUB_OUTPUT
          echo "docs_only=${DOCS_ONLY}" >> $GITHUB_OUTPUT
          echo "changed_count=${CHANGED_COUNT}" >> $GITHUB_OUTPUT

          echo "[precheck] mode=${MODE}, skip=${SKIP}, reason=${REASON}, changed=${CHANGED_COUNT}, docs_only=${DOCS_ONLY}"

      - name: Setup Node.js
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: template-project/package-lock.json

      - name: Install dependencies
        if: steps.precheck.outputs.skip != 'true'
        run: npm ci

      # ─── Step 1: Compute the real git diff ─────────────────────────────────
      - name: Compute PR diff (src + prisma only)
        id: diff
        if: steps.precheck.outputs.skip != 'true'
        run: |
          BASE="${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch origin "${BASE}"

          if git merge-base "origin/${BASE}" HEAD >/dev/null 2>&1; then
            RANGE="origin/${BASE}...HEAD"
          else
            echo "No merge-base found; using two-dot diff fallback"
            RANGE="origin/${BASE}..HEAD"
          fi

          # Diff between PR head and base, limited to source files
          git diff "${RANGE}" \
            -- 'src/**' 'prisma/**' \
            > /tmp/pr.diff || true

          LINES=$(wc -l < /tmp/pr.diff | tr -d ' ')
          echo "diff_lines=${LINES}" >> $GITHUB_OUTPUT
          echo "has_diff=$( [ ${LINES} -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "Diff size: ${LINES} lines"

      # ─── Step 2: Prepare enriched impact input ─────────────────────────────
      - name: Prepare PR impact input (with diff)
        if: steps.precheck.outputs.skip != 'true'
        run: |
          node scripts/prepare-pr-impact-input.js \
            --diff /tmp/pr.diff \
            --output scripts/pr-impact-input.json

      # ─── Step 3: LLM analysis ──────────────────────────────────────────────
      - name: Analyze PR impact via LLM
        id: llm-analysis
        if: steps.precheck.outputs.skip != 'true'
        env:
          # GitHub Models (free, uses built-in GITHUB_TOKEN — no extra secret needed).
          # Override by setting OPENAI_API_KEY secret + OPENAI_BASE_URL/OPENAI_MODEL vars
          # to use a different provider (OpenAI, Azure OpenAI, etc.).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.GITHUB_TOKEN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://models.inference.ai.azure.com' }}
        run: npm run analyze:pr-impact:staged

      # ─── Step 4: Validate LLM output ──────────────────────────────────────
      - name: Validate LLM impact artifact
        if: steps.precheck.outputs.skip != 'true'
        run: |
          if npm run validate:llm-impact; then
            echo "LLM impact artifact validation passed."
          else
            echo "LLM artifact validation failed; generating deterministic fallback artifact."
            PR_IMPACT_FALLBACK_DIFF=/tmp/pr.diff OPENAI_API_KEY='' node scripts/run-pr-impact-analysis-staged.js
            npm run validate:llm-impact
          fi

      # ─── Step 5: Apply knowledge updates ──────────────────────────────────
      - name: Apply knowledge updates (apply mode)
        id: apply-knowledge
        if: steps.precheck.outputs.skip != 'true'
        run: |
          APPLY_LLM_KNOWLEDGE_UPDATES=true npm run apply:knowledge:llm -- --apply
          node scripts/sync-knowledge-triad.js
          
          # Capture which files changed
          CHANGED=$(git diff --name-only | grep '^knowledge/' || true)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "${CHANGED}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ─── Step 6: Verify sync after updates ────────────────────────────────
      - name: Verify knowledge sync
        if: steps.precheck.outputs.skip != 'true'
        run: npm run verify:sync

      # ─── Step 7: Regenerate tests from updated knowledge ──────────────────
      - name: Generate tests from knowledge
        if: steps.precheck.outputs.skip != 'true'
        run: npm run generate:tests

      # ─── Step 8: Check if anything actually changed ────────────────────────
      - name: Detect changes to commit
        id: changes
        if: steps.precheck.outputs.skip != 'true'
        run: |
          git add knowledge/ tests/

          # Check for staged changes
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No knowledge or test changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            SUMMARY=$(git diff --cached --stat)
            echo "summary<<EOF" >> $GITHUB_OUTPUT
            echo "${SUMMARY}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            echo "${SUMMARY}"
          fi

      # ─── Step 9: Commit changes back to PR branch ─────────────────────────
      - name: Commit knowledge + test updates to PR branch
        if: steps.precheck.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -m "product-knowledge-as-code: AI agent — update knowledge and regenerate tests" -m $'AI agent analyzed PR diff (${{ steps.diff.outputs.diff_lines }} lines) and updated:\n- Knowledge files (md/yaml/gherkin) for impacted features\n- Generated test scaffolds from updated knowledge\n\nTriggered by: ${{ github.event.pull_request.title }}\nPR: #${{ github.event.number }}\nCommit: ${{ github.sha }}'

          git push origin "${{ github.head_ref }}"

      # ─── Step 10: Post PR comment ──────────────────────────────────────────
      - name: Post PR comment with agent summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const precheckSkipped = '${{ steps.precheck.outputs.skip }}' === 'true';
            const skipReason = '${{ steps.precheck.outputs.skip_reason }}';
            const skipMode = '${{ steps.precheck.outputs.mode }}';
            const docsOnly = '${{ steps.precheck.outputs.docs_only }}' === 'true';
            const changedCount = '${{ steps.precheck.outputs.changed_count }}';
            const hasChanges = '${{ steps.changes.outputs.has_changes }}' === 'true';
            const diffLines = '${{ steps.diff.outputs.diff_lines }}';
            const changedFiles = `${{ steps.apply-knowledge.outputs.changed_files }}`.trim();
            const changeSummary = `${{ steps.changes.outputs.summary }}`.trim();
            const llmResult = '${{ steps.llm-analysis.outcome }}';
            const applyResult = '${{ steps.apply-knowledge.outcome }}';

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let statusIcon;
            let statusTitle;
            if (precheckSkipped) {
              statusIcon = '⏭️';
              statusTitle = 'AI Knowledge Agent — Skipped';
            } else if (hasChanges) {
              statusIcon = '🤖';
              statusTitle = 'AI Knowledge Agent — Knowledge Updated';
            } else {
              statusIcon = '✅';
              statusTitle = 'AI Knowledge Agent — No Updates Needed';
            }

            let body = `## ${statusIcon} ${statusTitle}\n\n`;
            body += `**Workflow run:** [View run](${runUrl})\n\n`;

            if (precheckSkipped) {
              body += `### Skip Summary\n\n`;
              body += `- Mode: \`${skipMode || 'unknown'}\`\n`;
              body += `- Reason: ${skipReason || 'not provided'}\n`;
              body += `- Changed files in PR: ${changedCount || '0'}\n`;
              body += `- Docs only: ${docsOnly ? 'yes' : 'no'}\n\n`;
              body += `No knowledge/test update steps were executed for this run.\n\n`;
            } else {
              body += `**PR diff analysed:** ${diffLines} lines\n\n`;

              if (hasChanges) {
                body += `### Changes Committed\n\n`;
                body += `The agent updated the following knowledge files and regenerated tests:\n\n`;
                if (changedFiles) {
                  const files = changedFiles.split('\n').filter(Boolean);
                  body += files.map(f => `- \`${f}\``).join('\n') + '\n\n';
                }
                if (changeSummary) {
                  body += `\`\`\`\n${changeSummary}\n\`\`\`\n\n`;
                }
                body += `> **Review these changes** before approving the PR. `;
                body += `The knowledge files reflect the AI's interpretation of the code changes.\n\n`;
              } else {
                body += `Knowledge files and tests are already aligned with the code changes. No updates were needed.\n\n`;
              }
            }

            body += `### Pipeline\n\n`;
            body += `| Step | Status |\n|------|--------|\n`;
            body += `| Precheck | ${precheckSkipped ? `⏭️ skipped (${skipMode || 'policy'})` : '✅'} |\n`;
            body += `| Diff computed | ${precheckSkipped ? '⏭️' : '✅'} |\n`;
            body += `| LLM analysis | ${precheckSkipped ? '⏭️' : (llmResult === 'success' ? '✅' : '⚠️ fallback used')} |\n`;
            body += `| Knowledge validated | ${precheckSkipped ? '⏭️' : '✅'} |\n`;
            body += `| Updates applied | ${precheckSkipped ? '⏭️' : (applyResult === 'success' ? '✅' : '❌')} |\n`;
            body += `| Tests regenerated | ${precheckSkipped ? '⏭️' : '✅'} |\n`;
            body += `| Changes committed | ${precheckSkipped ? '⏭️' : (hasChanges ? '✅' : '— (nothing to commit)')} |\n`;

            body += `\n---\n_This comment is generated automatically by the [PR Knowledge Agent](.github/workflows/pr-knowledge-agent.yml)._`;

            // Find and update an existing agent comment, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('AI Knowledge Agent')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
