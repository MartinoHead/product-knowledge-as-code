name: PR Agent Test Report

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'template-project/knowledge/**'
      - 'template-project/tests/**'
      - 'template-project/package.json'
      - 'template-project/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-report:
    name: Run tests and publish report
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor == 'github-actions[bot]' }}
    env:
      BASE_API_URL: ${{ vars.REAL_API_BASE_URL }}
      BASE_URL: ${{ vars.REAL_API_BASE_URL }}

    defaults:
      run:
        working-directory: template-project

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: template-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        id: api
        continue-on-error: true
        run: npm run test:api

      - name: Run UI tests
        id: ui
        continue-on-error: true
        run: npm run test:ui

      - name: Build report summary
        if: always()
        id: summary
        run: |
          API_STATUS='${{ steps.api.outcome }}'
          UI_STATUS='${{ steps.ui.outcome }}'
          TARGET='${BASE_API_URL}'
          if [ -z "${TARGET}" ]; then
            TARGET='local webServer (REAL_API_BASE_URL not set)'
          fi

          {
            echo '## PR Agent Test Report'
            echo ''
            echo "- Target base URL: ${TARGET}"
            echo "- API tests: ${API_STATUS}"
            echo "- UI tests: ${UI_STATUS}"
            echo ''
            echo 'Artifacts uploaded:'
            echo '- playwright-report-api'
            echo '- playwright-report'
          } > /tmp/pr-agent-test-report.md

          cat /tmp/pr-agent-test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload API Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: template-project/playwright-report-api
          if-no-files-found: warn

      - name: Upload UI Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: template-project/playwright-report
          if-no-files-found: warn

      - name: Comment report on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const apiStatus = '${{ steps.api.outcome }}';
            const uiStatus = '${{ steps.ui.outcome }}';
            const target = `${{ vars.REAL_API_BASE_URL }}`.trim() || 'local webServer (REAL_API_BASE_URL not set)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## PR Agent Test Report',
              '',
              `- Target base URL: ${target}`,
              `- API tests: ${apiStatus}`,
              `- UI tests: ${uiStatus}`,
              '',
              `Workflow run: [View run](${runUrl})`,
              '',
              'Artifacts: playwright-report-api, playwright-report',
              '',
              '_Generated by .github/workflows/pr-agent-test-report.yml._'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((c) =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('PR Agent Test Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail workflow if tests failed
        if: always()
        run: |
          if [ '${{ steps.api.outcome }}' != 'success' ] || [ '${{ steps.ui.outcome }}' != 'success' ]; then
            echo 'One or more test suites failed.'
            exit 1
          fi
